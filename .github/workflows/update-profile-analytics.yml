name: Update GitHub Profile Analytics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-profile-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate profile analytics SVGs
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          cards: overview,lifetime,contributions,languages
          output-dir: assets
          themes: dark
          commit: true
          commit-message: "chore(profile): refresh GitHub analytics cards [skip ci]"

      - name: Generate combined all-repository commit dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_repo_activity.py

      - name: Commit combined activity dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/all-repositories-activity.svg
          git diff --cached --quiet || git commit -m "chore(profile): update all-repository activity dashboard [skip ci]"
          git push
