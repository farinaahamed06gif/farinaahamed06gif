name: Update GitHub Profile Analytics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-profile-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Generate profile analytics SVGs
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          cards: overview,lifetime,contributions,languages
          output-dir: assets
          themes: dark
          commit: true
          commit-message: "chore(profile): refresh GitHub analytics cards [skip ci]"
